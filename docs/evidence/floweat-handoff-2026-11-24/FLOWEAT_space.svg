    <rect x="77" y="610" width="383" height="96" rx="13" class="unknown"/><text x="98" y="643">좌석 구역</text><text x="98" y="677" font-size="15" font-weight="400" class="muted">부스·긴 테이블·분리 좌석 사진 확인</text>
    <rect x="509" y="610" width="383" height="96" rx="13" class="unknown"/><text x="530" y="643">브랜드별 수령대</text><text x="530" y="677" font-size="15" font-weight="400" class="muted">예: 값찌개 카운터 사진 · 전체 순서 미확인</text>
    <rect x="941" y="610" width="383" height="96" rx="13" class="unknown"/><text x="962" y="643">주문번호 모니터</text><text x="962" y="677" font-size="15" font-weight="400" class="muted">운영사 사진에 2개 · 현재 위치·총수 미확인</text>

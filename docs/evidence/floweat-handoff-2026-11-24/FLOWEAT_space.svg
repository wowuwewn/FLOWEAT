<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">단국대 죽전 혜당관 1층 1947 Commons 공간 근거도</title>
  <desc id="desc">정문을 가운데 두고 좌우에 키오스크 3대와 개별 대기열이 있다. 좌석과 수령대의 정확한 위치를 그리지 않는다. 대략적 동선 관계만 보여 주는 근거도이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#117170" stroke-width="2"/></marker>
    <style>
      text{font-family:"Noto Sans CJK KR",sans-serif;fill:#14283b} .muted{fill:#536577} .cap{fill:#0c6863;font-weight:700;letter-spacing:1px} .mono{font-family:"Noto Sans Mono CJK KR","Noto Sans CJK KR",sans-serif}
      .units{fill:#d8efec;stroke:#599795;stroke-width:1.5} .queue{fill:none;stroke:#117170;stroke-width:3;stroke-dasharray:4 7;marker-end:url(#arrow)} .unknown{fill:#f0f3f6;stroke:#94a5b7;stroke-width:1.5;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#edf2f6"/>
  <rect width="1400" height="139" fill="#122f50"/>
  <text x="55" y="47" font-size="18" fill="#69d4c3" style="fill:#69d4c3;letter-spacing:3px;font-weight:700">FLOWEAT / FIELD EVIDENCE</text>
  <text x="55" y="105" font-size="40" style="fill:#fff;font-weight:700">1947 COMMONS · 입구·주문 구역 근거도</text>
  <text x="1343" y="100" text-anchor="end" font-size="16" style="fill:#c6d6e7">죽전 혜당관 1층 · 2026.11</text>
  <rect x="47" y="167" width="1306" height="354" rx="22" fill="#fff" stroke="#d7e0ea"/>
  <text x="77" y="210" font-size="17" class="cap">01 / 사용자 현장 관찰</text>
  <text x="77" y="245" class="muted" font-size="20">정문을 기준으로 서서 식당 안쪽을 본 방향 · 거리와 기기 각도는 미실측</text>
  <text x="354" y="291" text-anchor="middle" font-size="21" font-weight="700">정문 왼쪽 · 키오스크 3대</text>
  <text x="1046" y="291" text-anchor="middle" font-size="21" font-weight="700">정문 오른쪽 · 키오스크 3대</text>

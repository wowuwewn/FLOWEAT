  <text x="115" y="457" font-size="16" class="muted">개별 대기열 방향</text><text x="1285" y="457" text-anchor="end" font-size="16" class="muted">개별 대기열 방향</text>
  <text x="700" y="483" text-anchor="middle" font-size="18" class="muted">모든 기기에서 같은 메뉴 주문 · 현장 기기 번호 없음 · 6대에 무장애 기기가 포함되는지는 미확인</text>
